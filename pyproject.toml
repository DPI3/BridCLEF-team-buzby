[project]
name = "birdclef-team-buzby"
version = "0.1.0"
# TensorFlow (data preparation, Part 2 of birdclef_draft_01) has no wheels for Python 3.14 yet.
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1",
    "kagglehub>=1.0.2",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "soundfile>=0.13",
    "tensorflow>=2.20",
    "tinytag>=2.3.2",
    "tqdm>=4.66",
]
